name: Build Debian modules

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debian ${{ matrix.debian }} / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        debian: ['11', '12', '13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Keep JavaScript actions on the host, including for older Debian/glibc.
      - name: Compile and test in the official Debian image
        env:
          DEBIAN_VERSION: ${{ matrix.debian }}
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/src" --workdir /src \
            --env DEBIAN_FRONTEND=noninteractive \
            --env DEBIAN_VERSION \
            "docker.io/library/debian:${DEBIAN_VERSION}-slim" \
            bash -euc '
              if [ "$DEBIAN_VERSION" = 11 ]; then
                # Bullseye has moved out of the regular security mirrors.
                printf "%s\n" \
                  "deb http://archive.debian.org/debian bullseye main" \
                  "deb http://archive.debian.org/debian-security bullseye-security main" \
                  > /etc/apt/sources.list
                apt-get -o Acquire::Check-Valid-Until=false update
              else
                apt-get update
              fi
              apt-get install --no-install-recommends -y \
                apache2-dev build-essential libssl-dev libtool-bin binutils python3
              make
              make test
              mkdir -p dist
              asset="mod_ja4-debian${DEBIAN_VERSION}-amd64"
              install -m 644 .libs/mod_ja4.so "dist/${asset}.so"
              strip --strip-unneeded "dist/${asset}.so"
              {
                cat /etc/os-release
                dpkg-query -W apache2-dev libc6 libssl-dev
                cc --version
                apxs -q HTTPD_VERSION
              } > "dist/${asset}.buildinfo.txt"
            '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mod_ja4-debian${{ matrix.debian }}-amd64
          path: dist/*
          if-no-files-found: error

  release:
    name: Upload release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mod_ja4-debian*-amd64
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.so ./*.buildinfo.txt > SHA256SUMS

      - name: Create release and upload modules
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
