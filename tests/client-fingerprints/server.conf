ServerName ja4-server
<VirtualHost *:443>
    ServerName ja4-server
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ja4-test.crt
    SSLCertificateKeyFile /etc/ssl/private/ja4-test.key
    DocumentRoot /var/www/html
    LogFormat "%U\t%>s\t%{ja4}n\t%{ja4_raw}n" fingerprints
    CustomLog /results/requests.tsv fingerprints
    ErrorLog /proc/self/fd/2
</VirtualHost>
